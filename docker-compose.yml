# docker-compose.yml pour l'application 7 Rendez-vous de Prière

services:
  prayer-app:
    build: .
    container_name: prayer-app
    init: true
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - CARNET_DIR=/data/carnets
    volumes:
      # Carnets synchronisés entre appareils. Le dossier doit appartenir à l'uid 1001 (nextjs).
      - ./data:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
        reservations:
          cpus: '0.10'
          memory: 96M
